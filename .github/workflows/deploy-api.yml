name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'docker/**'
      - '.github/workflows/deploy-api.yml'

# Solo un deploy a la vez para evitar condiciones de carrera
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy API → VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Para push a GitHub Container Registry

    steps:
      - uses: actions/checkout@v4

      # ── Build y push de imagen Docker ──────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/capacitaciones-api:latest
            ghcr.io/${{ github.repository_owner }}/capacitaciones-api:${{ github.sha }}
          # Cache de layers — reduce tiempo de build significativamente
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy al VPS via SSH ──────────────────────────────────────────────
      - name: Deploy al VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/capacitaciones

            # Autenticar Docker con GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Bajar la nueva imagen
            docker compose -f docker/docker-compose.prod.yml pull api

            # Levantar la nueva versión (zero-downtime con restart: unless-stopped)
            docker compose -f docker/docker-compose.prod.yml up -d api

            # Ejecutar migraciones de base de datos
            docker compose -f docker/docker-compose.prod.yml exec -T api \
              npx prisma migrate deploy

            # Limpiar imágenes antiguas
            docker image prune -f

            echo "Deploy completado: ${{ github.sha }}"

      - name: Notificar éxito
        if: success()
        run: echo "✅ Deploy exitoso → commit ${{ github.sha }}"

      - name: Notificar fallo
        if: failure()
        run: echo "❌ Deploy falló → revisar logs en GitHub Actions"
