events {
  worker_connections 1024;
}

http {
  # ── Rate limiting ────────────────────────────────────────────────────────────
  # Endpoints generales: 60 req/min por IP
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
  # Endpoints de auth: 10 req/min por IP (protección contra brute force)
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
  # Webhooks de Stripe: solo necesita 1 conexión a la vez por IP
  limit_req_zone $binary_remote_addr zone=webhooks:10m rate=30r/m;

  upstream api_backend {
    server api:3001;
    keepalive 32;
  }

  # ── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Para renovación de certificados Let's Encrypt
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ─────────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.tudominio.com;  # ← Cambiar por el dominio real

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    # Máximo tamaño de upload (documentos, imágenes)
    client_max_body_size 50M;

    # Headers de seguridad
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Webhooks de Stripe (sin rate limiting agresivo) ──────────────────────
    location /api/v1/subscriptions/webhook {
      limit_req zone=webhooks burst=10 nodelay;
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Endpoints de autenticación (rate limiting estricto) ──────────────────
    location ~ ^/api/v1/auth/(login|register|forgot-password) {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API general ──────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api_general burst=100 nodelay;
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
    }
  }
}
