<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4F7A"/>
      <stop offset="100%" stop-color="#0B2840"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FD1AE"/>
      <stop offset="100%" stop-color="#A8E6CF"/>
    </linearGradient>
  </defs>
  <!-- Fondo: cuadrado redondeado navy (visible sobre cualquier fondo de pestaña) -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <!-- Marca "C" apertura de lente en mint -->
  <path d="M 35 15 A 15 15 0 1 0 35 33" fill="none" stroke="url(#mark)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Punto focal del "lente" -->
  <circle cx="37" cy="24" r="3.5" fill="url(#mark)"/>
  <circle cx="37" cy="24" r="1.8" fill="#1E4F7A"/>
</svg>
